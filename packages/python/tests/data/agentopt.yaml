run:
  command: "python agent.py --input {input}"

improver:
  backend: claude-code
  optimizer: claude-opus-4-8
  judge: claude-haiku-4-5
  simulator: claude-haiku-4-5

models:
  production: kimi-k2.5
  allowed: [kimi-k2.5, llama-3.3-70b]
  never: ["gpt-*"]

code:
  include: ["services/prompts/**"]
  exclude: ["services/payments/**"]

protected: ["legal/*.py"]

websearch:
  enabled: true
  provider: auto

budget:
  max_tokens_per_run: 500000

privacy:
  redact: [email, phone]
  retention_days: 30
